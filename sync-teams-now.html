<!DOCTYPE html>
<html>
<head>
  <title>Sync Highlightly Teams</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      max-width: 500px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background: #2563eb;
    }
    button:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      text-align: left;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .success {
      background: #065f46;
      border: 1px solid #10b981;
    }
    .error {
      background: #7f1d1d;
      border: 1px solid #ef4444;
    }
    .loading {
      background: #1e40af;
      border: 1px solid #3b82f6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Sync Highlightly Teams</h1>
    <p>This will map all NFL and NCAA teams to Highlightly IDs</p>
    <button id="syncBtn" onclick="syncTeams()">Run Team Sync Now</button>
    <div id="result"></div>
  </div>

  <script>
    async function syncTeams() {
      const btn = document.getElementById('syncBtn');
      const result = document.getElementById('result');
      
      btn.disabled = true;
      btn.textContent = 'Syncing...';
      result.className = 'loading';
      result.textContent = 'Connecting to Supabase...\nFetching teams from Highlightly...\nThis may take 30-60 seconds...';
      
      try {
        const response = await fetch('https://dejuwyeypiggvlyfliap.supabase.co/functions/v1/sync-highlightly-teams', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlanV3eWV5cGlnZ3ZseWZsaWFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5NjU4MDgsImV4cCI6MjA2OTU0MTgwOH0.XHylH6wJuJjSZxU904oCZ33N0swsoRm6Tr2VjwI1Lz0',
            'Content-Type': 'application/json'
          }
        });
        
        const data = await response.json();
        
        if (response.ok) {
          result.className = 'success';
          result.textContent = `✅ SUCCESS!\n\nMatched: ${data.matched} teams\nUnmatched: ${data.unmatched} teams\nTotal: ${data.total} teams\n\nGeorgia and all teams are now mapped!\nHighlights and scores will start flowing.`;
        } else {
          result.className = 'error';
          result.textContent = `❌ ERROR:\n\n${JSON.stringify(data, null, 2)}`;
        }
      } catch (error) {
        result.className = 'error';
        result.textContent = `❌ NETWORK ERROR:\n\n${error.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Run Again';
      }
    }
  </script>
</body>
</html>
