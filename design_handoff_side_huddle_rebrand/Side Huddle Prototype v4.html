<style>

@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

  {id:'f3',type:'bot',uid:'bot',name:'Bears Bot',time:'8m',botType:'kalshi',data:{question:'Bears win Super Bowl LX?',yes:34,no:66,moved:'+4% today',myPick:null},reactions:{'🔥':17,'👍':9},myReactions:[]},
  {id:'f4',type:'bot',uid:'bot',name:'Bears Bot',time:'14m',botType:'xpost',data:{handle:'@AdamSchefter',verified:true,text:'Bears have requested tape on three defensive coordinators, per sources. Big offseason brewing in Chicago.',hasVideo:false},reactions:{'😂':22,'👍':15,'🔥':8},myReactions:['😂']},

function LivePill({label='LIVE'}){return(<div style={{display:'inline-flex',alignItems:'center',gap:5,background:'rgba(232,69,60,0.15)',border:'1px solid rgba(232,69,60,0.35)',borderRadius:20,padding:'2px 9px'}}><div style={{width:6,height:6,borderRadius:'50%',background:T.red,animation:'pulse 1.5s infinite'}}/><span style={{fontSize:10,fontWeight:800,color:T.red,letterSpacing:'0.09em'}}>{label}</span></div>);}

function SHLogo({size=28}){return(<div style={{width:size,height:size,borderRadius:'50%',background:'#000',border:`1.5px solid rgba(245,197,24,0.35)`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*.38,fontWeight:800,color:T.gold,fontFamily:'Georgia,serif',letterSpacing:'-1px',flexShrink:0}}>SH</div>);}

function BotAvatar({size=30}){return(<div style={{width:size,height:size,borderRadius:'50%',background:'rgba(245,197,24,0.08)',border:`1.5px solid rgba(245,197,24,0.25)`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:size*.38,fontWeight:800,color:T.gold,fontFamily:'Georgia,serif'}}>SH</div>);}

function StatusDot({status}){
  const c={watching:T.red,typing:T.green,online:T.green,offline:T.text3}[status]||T.text3;
  return <div style={{width:8,height:8,borderRadius:'50%',background:c,flexShrink:0,animation:status==='watching'?'pulse 1.5s infinite':'none'}}/>;
}

function AvatarStack({avatars,size=22,max=4,bgRing}){
  const ring=bgRing||T.bg;
  const shown=avatars.slice(0,max);
  return(<div style={{display:'flex'}}>
    {shown.map((a,i)=>(<div key={i} style={{width:size,height:size,borderRadius:'50%',background:T.bg3,border:`2px solid ${ring}`,marginLeft:i>0?-size*0.32:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*.55,zIndex:max-i}}>{a}</div>))}
  </div>);
}

function SourceBadge({source}){
  const c={ESPN:{bg:'rgba(220,0,0,0.12)',b:'rgba(220,0,0,0.25)',t:'#FF6666'},Kalshi:{bg:'rgba(59,130,246,0.12)',b:'rgba(59,130,246,0.25)',t:'#60A5FA'},X:{bg:'rgba(255,255,255,0.06)',b:'rgba(255,255,255,0.1)',t:T.text2}}[source]||{bg:T.bg3,b:T.border,t:T.text2};
  return <span style={{fontSize:9,fontWeight:700,letterSpacing:'0.07em',textTransform:'uppercase',background:c.bg,border:`1px solid ${c.b}`,color:c.t,borderRadius:4,padding:'1px 5px'}}>{source}</span>;
}

function VideoCard({label,big}){
  const [p,setP]=React.useState(false);
  return(<div onClick={e=>{e.stopPropagation();setP(v=>!v)}} style={{position:'relative',width:'100%',aspectRatio:'16/9',background:'#000',borderRadius:big?12:10,overflow:'hidden',marginTop:8,cursor:'pointer',border:`1px solid ${T.border}`}}>
    <div style={{position:'absolute',inset:0,background:'repeating-linear-gradient(45deg,#111 0,#111 10px,#0a0a0a 10px,#0a0a0a 20px)'}}/>
    <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8}}>
      <div style={{width:big?56:44,height:big?56:44,borderRadius:'50%',background:'rgba(245,197,24,0.9)',display:'flex',alignItems:'center',justifyContent:'center'}}>
        {!p?<svg width="18" height="20" viewBox="0 0 16 18"><path d="M1 1l14 8-14 8V1z" fill="#000"/></svg>:<div style={{display:'flex',gap:3}}><div style={{width:5,height:16,background:'#000',borderRadius:2}}/><div style={{width:5,height:16,background:'#000',borderRadius:2}}/></div>}
      </div>
      <span style={{fontSize:10,color:T.text3,fontFamily:'DM Mono'}}>{p?'Playing…':label}</span>
    </div>
  </div>);
}

function ImageCard(){return(<div style={{width:'100%',aspectRatio:'16/9',background:'#111',borderRadius:10,overflow:'hidden',marginTop:8,border:`1px solid ${T.border}`}}><div style={{width:'100%',height:'100%',background:'repeating-linear-gradient(135deg,#111 0,#111 12px,#0d0d0d 12px,#0d0d0d 24px)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:6}}><span style={{fontSize:24}}>📸</span><span style={{fontSize:10,color:T.text3,fontFamily:'DM Mono'}}>photo</span></div></div>);}

function ReactionPicker({visible,onPick,onClose,align='left'}){
  if(!visible) return null;
  const pos=align==='right'?{right:0}:{left:0};
  return(<div style={{position:'absolute',bottom:'calc(100% + 8px)',...pos,zIndex:60,animation:'popIn .2s ease forwards'}}>
    <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:30,padding:'7px 12px',display:'flex',gap:6,boxShadow:'0 8px 28px rgba(0,0,0,.6)'}}>
      {SPORT_REACTIONS.map(e=>(
        <button key={e} onClick={()=>{onPick(e);onClose();}} style={{fontSize:24,background:'none',border:'none',cursor:'pointer',padding:'2px 3px',WebkitTapHighlightColor:'transparent',lineHeight:1}}>{e}</button>
      ))}
    </div>
  </div>);}

function ReactionDisplay({reactions,myReactions,onReact,msgId,big,inverted}){
  const active=Object.entries(reactions||{}).filter(([,v])=>v>0);
  if(!active.length) return null;
  return(<div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:5,justifyContent:inverted?'flex-end':'flex-start'}}>
    {active.map(([e,count])=>{
      const mine=(myReactions||[]).includes(e);
      return(<button key={e} onClick={()=>onReact(msgId,e)} style={{display:'flex',alignItems:'center',gap:4,background:mine?T.goldDim:T.bg3,border:`1px solid ${mine?T.goldBorder:T.border}`,borderRadius:big?24:18,padding:big?'7px 14px':'4px 10px',cursor:'pointer',WebkitTapHighlightColor:'transparent',transition:'all .15s'}}>
        <span style={{fontSize:big?18:13}}>{e}</span>
        <span style={{fontFamily:'DM Mono',fontSize:big?14:11,fontWeight:700,color:mine?T.gold:T.text2}}>{count}</span>
      </button>);
    })}
  </div>);}

function BotScoreCard({data,big}){return(<div style={{background:'rgba(232,69,60,0.06)',border:'1px solid rgba(232,69,60,0.2)',borderRadius:12,overflow:'hidden'}}>

    <span style={{fontFamily:'DM Mono',fontSize:big?32:26,fontWeight:800,color:T.text3}}>{data.awayScore}</span>
    <span style={{fontSize:14,fontWeight:500,color:T.text3}}>{data.away}</span>
  </div>
  <div style={{padding:'6px 12px 10px',display:'flex',alignItems:'center',gap:6,borderTop:`1px solid rgba(232,69,60,0.15)`}}>
    <span style={{fontSize:12}}>🏈</span><span style={{fontSize:12,color:T.text,fontWeight:500}}>{data.event}</span>
  </div>
</div>);}

function BotXPost({data,big}){return(<div style={{background:T.bg3,border:`1px solid ${T.border}`,borderRadius:12,padding:'10px 12px'}}>
  <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
    <span style={{fontSize:12,fontWeight:700,color:T.text}}>{data.handle}</span>
    {data.verified&&<span style={{fontSize:10,color:T.blue}}>✓</span>}
    <SourceBadge source="X"/>
  </div>
  <p style={{fontSize:big?15:13,color:T.text,lineHeight:1.5}}>{data.text}</p>
  {data.hasVideo&&<VideoCard label={`${data.handle} · Video`} big={big}/>}
</div>);}

function BotKalshiCard({data}){
  const [myPick,setMyPick]=React.useState(data.myPick);
  const [yes,setYes]=React.useState(data.yes);
  const [no,setNo]=React.useState(data.no);
  const total=yes+no; const yp=Math.round(yes/total*100);
  const pick=side=>{
    if(myPick===side) return;
    if(myPick==='yes'){setYes(v=>v-1);setNo(v=>v+1);}else if(myPick==='no'){setNo(v=>v-1);setYes(v=>v+1);}
    else{side==='yes'?setYes(v=>v+1):setNo(v=>v+1);}
    setMyPick(side);
  };
  return(<div style={{background:'rgba(59,130,246,0.05)',border:'1px solid rgba(59,130,246,0.2)',borderRadius:12,overflow:'hidden'}}>
    <div style={{padding:'8px 12px',borderBottom:'1px solid rgba(59,130,246,0.15)',display:'flex',alignItems:'center',gap:6}}>
      <span style={{fontSize:11,fontWeight:700,color:'#60A5FA',letterSpacing:'0.05em'}}>🎯 PREDICTION</span>
      <span style={{fontSize:11,color:T.green,fontWeight:700,marginLeft:'auto'}}>{data.moved}</span>
    </div>
    <div style={{padding:'10px 12px'}}>
      <p style={{fontSize:14,fontWeight:600,color:T.text,marginBottom:10,lineHeight:1.4}}>{data.question}</p>
      <div style={{display:'flex',borderRadius:6,overflow:'hidden',height:6,marginBottom:8}}>
        <div style={{flex:yp,background:T.green,transition:'flex .4s'}}/><div style={{flex:100-yp,background:T.red,transition:'flex .4s'}}/>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <span style={{fontSize:11,color:T.text2}}>Yes <span style={{color:T.green,fontWeight:700,fontFamily:'DM Mono'}}>{yp}¢</span></span>
        <span style={{fontSize:11,color:T.text2}}>No <span style={{color:T.red,fontWeight:700,fontFamily:'DM Mono'}}>{100-yp}¢</span></span>
      </div>
      {!myPick?(<div style={{display:'flex',gap:8}}>
        <button onClick={()=>pick('yes')} style={{flex:1,padding:'9px',borderRadius:9,background:'rgba(34,197,94,0.12)',border:'1px solid rgba(34,197,94,0.3)',color:T.green,fontSize:13,fontWeight:700,cursor:'pointer'}}>✅ Yes</button>
        <button onClick={()=>pick('no')} style={{flex:1,padding:'9px',borderRadius:9,background:'rgba(232,69,60,0.12)',border:'1px solid rgba(232,69,60,0.3)',color:T.red,fontSize:13,fontWeight:700,cursor:'pointer'}}>❌ No</button>
      </div>):(<div style={{padding:'9px 12px',borderRadius:9,background:myPick==='yes'?'rgba(34,197,94,0.12)':'rgba(232,69,60,0.12)',border:`1px solid ${myPick==='yes'?'rgba(34,197,94,0.3)':'rgba(232,69,60,0.3)'}`,display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:14}}>{myPick==='yes'?'✅':'❌'}</span>
        <span style={{fontSize:12,fontWeight:700,color:myPick==='yes'?T.green:T.red}}>You picked {myPick.toUpperCase()}</span>
        <button onClick={()=>setMyPick(null)} style={{marginLeft:'auto',fontSize:11,color:T.text3,background:'none',border:'none',cursor:'pointer'}}>change</button>
      </div>)}
    </div>
  </div>);}

function BotNewsCard({data,source}){return(<div style={{background:T.bg3,border:`1px solid ${T.border}`,borderRadius:12,padding:'10px 12px'}}>
  <div style={{marginBottom:6}}><SourceBadge source={source}/></div>
  <p style={{fontSize:14,fontWeight:600,color:T.text,lineHeight:1.45}}>{data.headline}</p>
  {data.hasImage&&<ImageCard/>}
</div>);}

const renderBotInner=(msg,big)=>{switch(msg.botType){
  case 'score':return <BotScoreCard data={msg.data} big={big}/>;
  case 'xpost':return <BotXPost data={msg.data} big={big}/>;

// Fake QR — block grid placeholder
function FakeQR({size=64,fg='#000',bg='#fff'}){
  const cells=React.useMemo(()=>{
    const seed='sidehuddle';const arr=[];
    for(let i=0;i<11*11;i++){const v=(seed.charCodeAt(i%seed.length)*31+i*7)%5;arr.push(v<2);}
    return arr;
  },[]);
  return(<div style={{width:size,height:size,background:bg,padding:size*0.07,borderRadius:6,flexShrink:0,position:'relative'}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(11,1fr)',gap:1,width:'100%',height:'100%'}}>
      {cells.map((on,i)=>{
        const col=i%11,row=Math.floor(i/11);
        const corner=(row<3&&col<3)||(row<3&&col>7)||(row>7&&col<3);
        return(<div key={i} style={{background:(on||corner)?fg:bg,borderRadius:1}}/>);
      })}
    </div>
    {/* corner markers */}
    {[[0,0],[0,1],[1,0]].map(([r,c],i)=>{
      const sz=size*0.22;
      const top=r==0?size*0.07:size*0.07+size*0.78;
      const left=c==0?size*0.07:size*0.07+size*0.78;
      return(<div key={i} style={{position:'absolute',top,left:c==1?size*0.07+size*0.78:left,width:sz,height:sz,border:`${size*0.04}px solid ${fg}`,borderRadius:size*0.04,background:bg}}>
        <div style={{position:'absolute',inset:'18%',background:fg,borderRadius:size*0.02}}/>
      </div>);
    })}
  </div>);
}

// ─── HUDDLE (active group chat, top-down) ─────────────────────
function HuddleScreen({huddle,onBack,onNavigate,onChangeRoom,sponsor}){
  const [msgs,setMsgs]=React.useState(buildHuddleMsgs);
  const [input,setInput]=React.useState('');
  const [showMentions,setShowMentions]=React.useState(false);
  const [mentionFilter,setMentionFilter]=React.useState('');
  const [showWho,setShowWho]=React.useState(false);
  const [showSwitcher,setShowSwitcher]=React.useState(false);
  const watchers=HUDDLE_MEMBERS.filter(m=>m.status==='watching');
  const onlineCount=HUDDLE_MEMBERS.filter(m=>m.status!=='offline').length;

  React.useEffect(()=>{setMsgs(buildHuddleMsgs());setInput('');},[huddle?.id]);

  const react=(id,e)=>setMsgs(prev=>prev.map(m=>{if(m.id!==id||!m.reactions)return m;const mine=(m.myReactions||[]).includes(e);return{...m,reactions:{...m.reactions,[e]:(m.reactions[e]||0)+(mine?-1:1)},myReactions:mine?(m.myReactions||[]).filter(x=>x!==e):[...(m.myReactions||[]),e]};}));

  const handleInput=e=>{
    const val=e.target.value; setInput(val);
    const at=val.match(/@(\w*)$/);
    if(at){setShowMentions(true);setMentionFilter(at[1].toLowerCase());}else setShowMentions(false);
  };
  const insertMention=m=>{setInput(prev=>prev.replace(/@\w*$/,`@${m.name} `));setShowMentions(false);};

  const send=()=>{
    if(!input.trim()) return;
    // NEW MESSAGES APPEAR AT THE TOP
    setMsgs(prev=>[{id:`m${Date.now()}`,type:'msg',uid:'me',name:'You',avatar:'😎',time:'now',isOwn:true,text:input.trim(),reactions:{},myReactions:[],replies:[]},...prev]);
    setInput(''); setShowMentions(false);
  };

  const grouped=msgs.map((m,i)=>{
    if(m.type==='system') return {...m,showAvatar:false};
    const next=msgs[i+1];
    const showAvatar=!next||next.uid!==m.uid||next.type==='system';
    return {...m,showAvatar};
  });
  const filtered=HUDDLE_MEMBERS.filter(m=>m.name.toLowerCase().includes(mentionFilter));

  return(<div style={{height:'100%',display:'flex',flexDirection:'column',background:T.bgHuddle,position:'relative',
    backgroundImage:'radial-gradient(circle at 0% 0%, rgba(245,197,24,0.025), transparent 50%), radial-gradient(circle at 100% 100%, rgba(59,130,246,0.02), transparent 50%)'}}>
    <div style={{padding:'52px 14px 10px',background:'rgba(20,20,24,0.96)',backdropFilter:'blur(12px)',borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex'}}>
          <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><path d="M8 2L2 8l6 6" stroke={T.gold} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <button onClick={()=>setShowSwitcher(true)} style={{flex:1,display:'flex',alignItems:'center',gap:10,background:'none',border:'none',padding:'2px 0',cursor:'pointer',textAlign:'left',fontFamily:'DM Sans,sans-serif'}}>
          <div style={{width:36,height:36,borderRadius:'50%',background:T.bg3,border:`1px solid ${T.border}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{huddle.emoji||'🏆'}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:1}}>
              <span style={{fontSize:10,fontWeight:800,letterSpacing:'0.14em',color:T.gold}}>HUDDLE</span>
              <AvatarStack avatars={watchers.map(w=>w.avatar)} size={14} max={3} bgRing={'#141418'}/>
              <span style={{fontSize:10,color:T.text3,fontWeight:500}}>· {watchers.length} watching</span>
            </div>
            <div style={{fontSize:15,fontWeight:700,color:T.text,lineHeight:1.2,display:'flex',alignItems:'center',gap:6}}>
              <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{huddle.name||'The Boys Fantasy'}</span>
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none" style={{flexShrink:0}}><path d="M1 1l4 4 4-4" stroke={T.text3} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          </div>
        </button>
        <span style={{fontSize:18,color:T.text3,cursor:'pointer',padding:'0 4px'}}>···</span>
      </div>
    </div>

    {/* Live presence bar */}
    <div onClick={()=>setShowWho(true)} style={{padding:'10px 16px',background:'rgba(245,197,24,0.04)',borderBottom:`1px solid ${T.borderSoft}`,display:'flex',alignItems:'center',gap:10,cursor:'pointer',flexShrink:0}}>
      <AvatarStack avatars={HUDDLE_MEMBERS.filter(m=>m.status!=='offline').map(m=>m.avatar)} size={26} max={5} bgRing={'#141418'}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:12,color:T.text,fontWeight:600,display:'flex',alignItems:'center',gap:5}}>
          <div style={{width:6,height:6,borderRadius:'50%',background:T.green,animation:'pulse 1.5s infinite'}}/>
          <span>{onlineCount} in the room</span>
        </div>
        <div style={{fontSize:11,color:T.text3,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {watchers.map(w=>w.name).join(', ')} watching · Dan is typing…
        </div>
      </div>
      <span style={{fontSize:11,color:T.gold,fontWeight:600,flexShrink:0}}>See all →</span>
    </div>

    <div style={{flex:1,overflowY:'auto',padding:'8px 0 4px'}}>
      {grouped.map(m=><HuddleBubble key={m.id} msg={m} onReact={react} showAvatar={m.showAvatar} sponsor={sponsor}/>)}
      <div style={{height:8}}/>
    </div>

    {showMentions&&filtered.length>0&&(<div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:12,margin:'0 12px',overflow:'hidden',flexShrink:0}}>
      {filtered.map(m=>(<div key={m.uid} onClick={()=>insertMention(m)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',cursor:'pointer',borderBottom:`1px solid ${T.border}`}}>
        <div style={{width:28,height:28,borderRadius:'50%',background:T.bg3,border:`1px solid ${T.border}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>{m.avatar}</div>
        <span style={{fontSize:14,fontWeight:600,color:T.text}}>{m.name}</span>
        <StatusDot status={m.status}/>
      </div>))}
    </div>)}

    <div style={{padding:'8px 12px 12px',background:'rgba(20,20,24,0.96)',borderTop:`1px solid ${T.border}`,flexShrink:0}}>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <button style={{width:32,height:32,borderRadius:'50%',background:T.bg3,border:`1px solid ${T.border}`,color:T.text2,fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>+</button>
        <div style={{flex:1,background:T.bg3,border:`1px solid ${T.border}`,borderRadius:20,padding:'9px 14px',display:'flex',alignItems:'center',gap:8}}>
          <input value={input} onChange={handleInput} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Message the huddle… or @mention" style={{flex:1,background:'none',border:'none',outline:'none',fontSize:15,color:T.text,fontFamily:'DM Sans,sans-serif',caretColor:T.gold}}/>
        </div>
        <button onClick={send} style={{width:36,height:36,borderRadius:'50%',background:input.trim()?T.gold:T.bg3,border:`1px solid ${input.trim()?T.gold:T.border}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h12M7 1l6 6-6 6" stroke={input.trim()?'#000':T.text3} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>
    </div>

    {showWho&&<WhoSheet onClose={()=>setShowWho(false)}/>}
    {showSwitcher&&<RoomSwitcher current={huddle} onPick={onChangeRoom} onClose={()=>setShowSwitcher(false)} onNavigate={onNavigate}/>}
    <BottomNav active="home" onNavigate={onNavigate}/>
  </div>);
}

function BottomNav({active,onNavigate}){
  const items=[{id:'home',icon:'⊞',label:'Home'},{id:'teams',icon:'🏈',label:'Teams'},{id:'picks',icon:'🎯',label:'Picks'},{id:'me',icon:'👤',label:'Me'}];
  return(<div style={{display:'flex',justifyContent:'space-around',alignItems:'center',padding:'8px 0 24px',background:'rgba(10,10,11,0.96)',backdropFilter:'blur(12px)',borderTop:`1px solid ${T.border}`,flexShrink:0}}>
    {items.map(item=>{const a=active===item.id;return(<button key={item.id} onClick={()=>onNavigate(item.id)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,background:'none',border:'none',cursor:'pointer',padding:'4px 16px'}}>
      <span style={{fontSize:20,lineHeight:1}}>{item.icon}</span>
      <span style={{fontSize:10,fontWeight:600,color:a?T.gold:T.text3}}>{item.label}</span>
      {a&&<div style={{width:4,height:4,borderRadius:'50%',background:T.gold,marginTop:-2}}/>}
    </button>);})}
  </div>);
}

function App(){
  const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
    "startScreen": "home",
    "sponsor": "hashmark"
  }/*EDITMODE-END*/;
  const [screen,setScreen]=React.useState(TWEAK_DEFAULTS.startScreen||'home');
  const [sponsorId,setSponsorId]=React.useState(TWEAK_DEFAULTS.sponsor||'draftpass');
  const sponsor=SPONSORS[sponsorId]||SPONSORS.draftpass;
  const [ctx,setCtx]=React.useState(null);
  const [tweaksVisible,setTweaksVisible]=React.useState(false);

  React.useEffect(()=>{
    const h=e=>{if(e.data?.type==='__activate_edit_mode')setTweaksVisible(true);if(e.data?.type==='__deactivate_edit_mode')setTweaksVisible(false);};
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);

  const navigate=(dest,context=null)=>{
    if(dest==='feed'||dest==='huddle'){setCtx(context);setScreen(dest);}
    else{setScreen(dest);setCtx(null);}
  };

  const renderScreen=()=>{
    switch(screen){
      case 'onboard': return <OnboardingFlow onDone={()=>setScreen('home')}/>;
      case 'home': return <HomeScreen onNavigate={navigate}/>;
      case 'feed': return <FeedScreen team={ctx||MY_TEAMS[0]} onBack={()=>setScreen('home')} onNavigate={navigate} sponsor={sponsor}/>;
      case 'huddle': return <HuddleScreen huddle={ctx||MY_HUDDLES[0]} onBack={()=>setScreen('home')} onNavigate={navigate} onChangeRoom={h=>{setCtx(h);}} sponsor={sponsor}/>;
      default: return <HomeScreen onNavigate={navigate}/>;
    }
  };

  return(<>
    <div style={{width:'100vw',height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#0A0A0B',position:'relative'}}>
      <div style={{position:'absolute',top:18,left:'50%',transform:'translateX(-50%)',display:'flex',alignItems:'center',gap:8,whiteSpace:'nowrap'}}>
        <SHLogo size={22}/>
        <span style={{fontSize:11,fontWeight:600,color:'#404048',letterSpacing:'0.07em'}}>SIDE HUDDLE v5 · LIVE NOW · feed = passive · huddle = bubble chat (top-down)</span>
      </div>
      <div style={{width:390,height:844,borderRadius:52,overflow:'hidden',background:T.bg,boxShadow:'0 0 0 12px #141416,0 0 0 14px #1f1f22,0 40px 80px rgba(0,0,0,.6)',position:'relative',flexShrink:0}}>
        <div style={{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:120,height:34,borderRadius:20,background:'#000',zIndex:100}}/>
        <div style={{position:'absolute',top:0,left:0,right:0,height:54,zIndex:50,display:'flex',alignItems:'flex-end',justifyContent:'space-between',padding:'0 28px 6px',pointerEvents:'none'}}>
          <span style={{fontFamily:'-apple-system',fontWeight:600,fontSize:15,color:T.text}}>9:41</span>
          <div style={{display:'flex',gap:5,alignItems:'center'}}>
            <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx=".5" fill={T.text}/><rect x="4.7" y="5.5" width="3" height="6.5" rx=".5" fill={T.text}/><rect x="9.4" y="3" width="3" height="9" rx=".5" fill={T.text}/><rect x="14" y="0" width="3" height="12" rx=".5" fill={T.text}/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill={T.text}/><path d="M4.5 7C5.8 5.7 7 5 8 5s2.2.7 3.5 2" stroke={T.text} strokeWidth="1.5" fill="none" strokeLinecap="round"/><path d="M1.5 4C3.3 2.2 5.5 1 8 1s4.7 1.2 6.5 3" stroke={T.text} strokeWidth="1.5" fill="none" strokeLinecap="round"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.5" stroke={T.text} strokeOpacity=".35" fill="none"/><rect x="2" y="2" width="16" height="8" rx="2" fill={T.text}/><path d="M23 4v4c.8-.3 1.5-1.2 1.5-2s-.7-1.7-1.5-2z" fill={T.text} fillOpacity=".4"/></svg>
          </div>
        </div>
        <div style={{position:'absolute',inset:0}}>{renderScreen()}</div>
        <div style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:134,height:5,borderRadius:100,background:'rgba(255,255,255,0.2)',zIndex:200,pointerEvents:'none'}}/>
      </div>
    </div>
    <div id="tweaks-panel" className={tweaksVisible?'visible':''}>
      <div className="tweak-title">Tweaks</div>
      <div className="tweak-row"><span className="tweak-label">Jump to</span>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          {[['onboard','Intro'],['home','Home'],['feed','Feed'],['huddle','Huddle']].map(([s,l])=>(
            <button key={s} className={`tb ${screen===s?'active':''}`} onClick={()=>navigate(s,s==='feed'?MY_TEAMS[0]:s==='huddle'?MY_HUDDLES[0]:null)} style={{fontSize:11,padding:'3px 7px'}}>{l}</button>
          ))}
        </div>
      </div>
      <div className="tweak-row"><span className="tweak-label">Switch huddle</span>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          {MY_HUDDLES.map(h=>(<button key={h.id} className={`tb ${ctx?.id===h.id?'active':''}`} onClick={()=>navigate('huddle',h)} style={{fontSize:11,padding:'3px 7px'}}>{h.emoji}</button>))}
        </div>
      </div>
      <div className="tweak-row"><span className="tweak-label">Sponsor</span>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          {Object.values(SPONSORS).map(s=>(<button key={s.id} className={`tb ${sponsorId===s.id?'active':''}`} onClick={()=>{setSponsorId(s.id);window.parent.postMessage({type:'__edit_mode_set_keys',edits:{sponsor:s.id}},'*');}} style={{fontSize:11,padding:'3px 7px'}}>{s.name}</button>))}
        </div>
      </div>
    </div>
  </>);}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<div id="root"></div>
</body>
</html>
