<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Side Huddle">
  <!--
    The ripple mark, drawn rather than traced.

    The old favicon was a 1024pt auto-traced path filled #000000 — a black
    blob on a dark tab, and a 2.4KB path for something that renders at 16px.
    This is geometry: three rings and a centre, which survives downscaling in
    a way letterforms do not, and it is the same mark the app opens on.
  -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <g fill="none" stroke="#F5C518" stroke-linecap="round">
    <circle cx="32" cy="32" r="21" stroke-width="2.5" opacity="0.35"/>
    <circle cx="32" cy="32" r="14" stroke-width="3" opacity="0.65"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="#F5C518"/>
</svg>
