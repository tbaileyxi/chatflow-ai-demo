<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="logoClip">
      <circle cx="600" cy="260" r="88"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gold glow blob -->
  <circle cx="600" cy="240" r="300" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="3" fill="#FFD700" opacity="0.6"/>

  <!-- Logo circle (clipped to circle) -->
  <circle cx="600" cy="220" r="88" fill="#0a0a0a" stroke="#FFD700" stroke-width="2" opacity="0.3"/>
  <image href="/sh-logo-updated.png" x="512" y="132" width="176" height="176" clip-path="url(#logoClip)"/>

  <!-- You've been invited pill -->
  <rect x="462" y="336" width="276" height="36" rx="18" fill="#FFD700" fill-opacity="0.12" stroke="#FFD700" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#FFD700" letter-spacing="3">YOU'VE BEEN INVITED</text>

  <!-- Main headline -->
  <text x="600" y="430" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Join the Huddle</text>

  <!-- Sub text -->
  <text x="600" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" opacity="0.5">Chat live with your crew on Side Huddle Sports</text>

  <!-- Bottom brand -->
  <text x="600" y="570" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFD700" letter-spacing="5" opacity="0.6">SIDEHUDDLESPORTS.COM</text>

  <!-- Side decorative lines -->
  <line x1="80" y1="315" x2="420" y2="315" stroke="#FFD700" stroke-width="0.5" opacity="0.15"/>
  <line x1="780" y1="315" x2="1120" y2="315" stroke="#FFD700" stroke-width="0.5" opacity="0.15"/>
</svg>
